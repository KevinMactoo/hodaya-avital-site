<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CRM · Hodaya Avital</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap">
<style>
  :root{--ink:#1E0B33;--ground:#E9E3F2;--paper:#F6F2FB;--accent:#7B2CBF;--accent-d:#5E1F96;--muted:#5A4C6B;--line:#DDD3EA;--ok:#1F7A4D;--warn:#A15C00;--bad:#B3261E}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.45;font-size:15px}
  a{color:var(--accent)}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}
  .display{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:1px;line-height:1;margin:0}
  .hidden{display:none !important}
  button,input,select,textarea{font:inherit;color:inherit}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;font-size:13px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn:hover{background:#12061F}
  .btn.accent{background:var(--accent)} .btn.accent:hover{background:var(--accent-d)}
  .btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)} .btn.ghost:hover{border-color:var(--ink)}
  .btn.small{min-height:36px;padding:0 12px;font-size:12px}
  .btn.danger{background:transparent;color:var(--bad);border:2px solid #F0C9C6}
  input,select,textarea{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{min-height:80px;resize:vertical}
  label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  label.check{display:flex;align-items:center;gap:10px;font-weight:600;min-height:44px}
  label.check input{width:22px;height:22px;min-height:0}

  /* Login */
  .login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ground)}
  .login form{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}

  /* App shell */
  header.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
  header.top .display{font-size:24px}
  header.top .btn.ghost{color:#fff;border-color:rgba(255,255,255,.3)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
  .stat{background:#fff;border-radius:14px;padding:16px;border:0;text-align:left;cursor:default}
  .stat b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:34px;line-height:1.1}
  .stat span{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
  .tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:16px}
  .tabs button{border:0;background:none;padding:12px 14px;min-height:44px;font-weight:800;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  .tabs .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;line-height:20px;text-align:center}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar input[type=search]{flex:1;min-width:180px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:0 12px;min-height:36px;font-weight:600;font-size:13px;cursor:pointer}
  .chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .list{display:flex;flex-direction:column;gap:10px;padding-bottom:60px}
  .card{background:#fff;border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:start}
  .card h3{margin:0;font-size:17px}
  .meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px}
  .note{color:var(--muted);font-size:14px;margin:0;white-space:pre-wrap}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
  .actions select{width:auto;min-height:36px;padding:4px 10px;font-size:13px;font-weight:600}
  .pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.3px}
  .pill.Requested{background:#FFF1D6;color:var(--warn)} .pill.Confirmed{background:#EDE3FA;color:var(--accent-d)}
  .pill.Attended{background:#DDF3E7;color:var(--ok)} .pill.No-show,.pill.Cancelled{background:#F8E1DF;color:var(--bad)}
  .pill.paid{background:#DDF3E7;color:var(--ok)} .pill.unpaid{background:#F3EEF8;color:var(--muted)}
  .pill.draft{background:#F3EEF8;color:var(--muted)} .pill.live{background:#DDF3E7;color:var(--ok)}
  .empty{background:#fff;border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
  .banner{background:#FFF1D6;color:#5C3A00;border-radius:12px;padding:12px 16px;margin-top:16px;font-weight:600}
  .total{font-weight:800}

  /* Modal */
  dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);max-height:90vh;color:var(--ink)}
  dialog::backdrop{background:rgba(18,6,31,.6)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:2px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
  .modal-head h2{margin:0;font-size:20px}
  .modal-body{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .modal-body .full{grid-column:1/-1}
  .modal-foot{display:flex;justify-content:space-between;gap:10px;padding:16px 20px;border-top:2px solid var(--line);position:sticky;bottom:0;background:#fff}
  .icon-btn{width:44px;height:44px;border-radius:999px;border:0;background:var(--paper);font-size:22px;font-weight:800;cursor:pointer}
  .err{color:var(--bad);font-weight:600;margin:0}
  .history{grid-column:1/-1;border-top:2px solid var(--line);padding-top:14px}
  .history h4{margin:0 0 8px;font-size:12px;letter-spacing:.5px;text-transform:uppercase}
  .history ul{margin:0 0 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .history li{background:var(--paper);border-radius:10px;padding:8px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;z-index:50}

  @media (max-width:760px){
    .stats{grid-template-columns:1fr 1fr}
    .card{grid-template-columns:1fr}
    .actions{justify-content:flex-start}
    .modal-body{grid-template-columns:1fr}
    header.top .display{font-size:20px}
  }
</style>
</head>
<body>

<!-- Login -->
<div class="login hidden" id="login">
  <form id="login-form">
    <h1 class="display" style="font-size:34px">Hodaya <span style="color:var(--accent)">CRM</span></h1>
    <label class="f">Password <input type="password" id="pw" autocomplete="current-password" required></label>
    <p class="err" id="login-err" role="alert"></p>
    <button class="btn accent" type="submit">Sign in</button>
    <a href="/" style="font-size:14px">Back to website</a>
  </form>
</div>

<!-- App -->
<div id="app" class="hidden">
  <header class="top">
    <div class="wrap">
      <span class="display">Hodaya <span style="color:#CDA8F5">CRM</span></span>
      <div style="display:flex;gap:8px">
        <button class="btn ghost small" id="refresh" type="button">Refresh</button>
        <button class="btn ghost small" id="logout" type="button">Sign out</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div id="banner"></div>
    <div class="stats" id="stats"></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="bookings" aria-selected="true">Bookings</button>
      <button role="tab" data-tab="clients" aria-selected="false">Clients</button>
      <button role="tab" data-tab="payments" aria-selected="false">Payments</button>
      <button role="tab" data-tab="events" aria-selected="false">Events</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<dialog id="modal" aria-labelledby="modal-title">
  <form method="dialog" id="modal-form" novalidate>
    <div class="modal-head"><h2 id="modal-title"></h2><button class="icon-btn" type="button" id="modal-x" aria-label="Close">&times;</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot">
      <div><button class="btn danger small hidden" type="button" id="modal-del">Delete</button></div>
      <div style="display:flex;gap:8px;align-items:center">
        <p class="err" id="modal-err" role="alert"></p>
        <button class="btn accent" type="submit" id="modal-save">Save</button>
      </div>
    </div>
  </form>
</dialog>

<script>
(() => {
  const STATUSES = ['Requested', 'Confirmed', 'Attended', 'No-show', 'Cancelled'];
  const CLASSES = ['Afro', 'Hip Hop', 'Afro & Hip Hop'];
  const TYPES = ['Group class', 'Private session', 'Event'];
  const LEVELS = ['', 'Beginner', 'Intermediate', 'Advanced'];
  const METHODS = ['Cash', 'Bit', 'PayBox', 'Bank transfer', 'Card', 'Other'];
  const CUR = '₪';
  let data = { clients: [], bookings: [], payments: [], events: [] };
  let tab = 'bookings';
  const ui = { bookingStatus: 'All', q: { bookings: '', clients: '', payments: '', events: '' } };

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (k === 'text') n.textContent = v;
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid instanceof Node ? kid : String(kid));
    return n;
  }
  const today = () => new Date().toISOString().slice(0, 10);
  const money = n => CUR + (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-US');
  function fmtDate(d) {
    if (!d) return '';
    try { return new Date(d + 'T12:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return d; }
  }
  const byId = (col, id) => data[col].find(r => r.id === id);
  function waLink(phone, text) {
    let d = String(phone || '').replace(/\D/g, '');
    if (d.startsWith('0')) d = '972' + d.slice(1);
    return d.length >= 7 ? 'https://wa.me/' + d + (text ? '?text=' + encodeURIComponent(text) : '') : null;
  }
  function toast(msg) {
    const t = el('div', { class: 'toast', role: 'status', text: msg });
    document.body.append(t); setTimeout(() => t.remove(), 2200);
  }
  async function api(method, payload) {
    const r = await fetch('/api/admin', { method, headers: { 'Content-Type': 'application/json' }, body: payload ? JSON.stringify(payload) : undefined, credentials: 'same-origin' });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { showLogin(); throw new Error('Please sign in again.'); }
    if (!r.ok) throw new Error(j.error || 'Something went wrong.');
    return j;
  }
  async function save(collection, record) {
    const j = await api('POST', { action: 'save', collection, record });
    const list = data[collection]; const i = list.findIndex(x => x.id === j.record.id);
    if (i >= 0) list[i] = j.record; else list.push(j.record);
    return j.record;
  }
  async function del(collection, id) {
    await api('POST', { action: 'delete', collection, id });
    data[collection] = data[collection].filter(x => x.id !== id);
  }
  function csv(rows, cols, name) {
    const esc = v => { v = v == null ? '' : String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const text = [cols.map(c => c[0]).join(',')].concat(rows.map(r => cols.map(c => esc(c[1](r))).join(','))).join('\n');
    const a = el('a', { href: URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv' })), download: name + '-' + today() + '.csv' });
    document.body.append(a); a.click(); a.remove();
  }

  // ---------- auth ----------
  function showLogin(msg) { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('login-err').textContent = msg || ''; $('pw').focus(); }
  $('login-form').addEventListener('submit', async e => {
    e.preventDefault(); $('login-err').textContent = '';
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('pw').value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { $('login-err').textContent = j.error || 'Could not sign in.'; return; }
    $('pw').value = ''; start();
  });
  $('logout').addEventListener('click', async () => { await fetch('/api/login', { method: 'DELETE' }); showLogin(); });
  $('refresh').addEventListener('click', () => load().then(() => toast('Up to date')));

  async function start() {
    const s = await fetch('/api/login').then(r => r.json()).catch(() => ({}));
    if (!s.passwordSet) return showLogin('The CRM password is not set yet. Add ADMIN_PASSWORD in Vercel, then redeploy.');
    if (!s.authed) return showLogin();
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    $('banner').replaceChildren(s.dbConnected ? '' : el('div', { class: 'banner', text: 'The database is not connected yet, so nothing can be saved. In Vercel, open Storage and add Upstash Redis to this project, then redeploy.' }));
    if (s.dbConnected) await load(); else render();
  }
  async function load() {
    try { data = await api('GET'); } catch (e) { toast(e.message); }
    render();
  }

  // ---------- tabs ----------
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    tab = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
    render();
  }));

  function render() {
    renderStats();
    const req = data.bookings.filter(b => b.status === 'Requested').length;
    const bt = document.querySelector('[data-tab=bookings]');
    bt.replaceChildren('Bookings', req ? el('span', { class: 'count', text: req }) : '');
    ({ bookings: renderBookings, clients: renderClients, payments: renderPayments, events: renderEvents })[tab]();
  }

  function renderStats() {
    const t = today(); const in7 = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
    const month = t.slice(0, 7);
    const live = data.bookings.filter(b => b.status !== 'Cancelled');
    const stats = [
      ['New requests', data.bookings.filter(b => b.status === 'Requested').length],
      ['Next 7 days', live.filter(b => b.date >= t && b.date <= in7).length],
      ['Unpaid', live.filter(b => !b.paid && b.status !== 'No-show' && b.date <= t).length],
      ['Paid this month', money(data.payments.filter(p => (p.date || '').startsWith(month)).reduce((s, p) => s + Number(p.amount || 0), 0))],
    ];
    $('stats').replaceChildren(...stats.map(([l, v]) => el('div', { class: 'stat' }, el('b', { text: v }), el('span', { text: l }))));
  }

  function toolbar(key, placeholder, addLabel, onAdd, exportFn) {
    const s = el('input', { type: 'search', placeholder, 'aria-label': placeholder, value: ui.q[key] });
    s.addEventListener('input', () => { ui.q[key] = s.value; const pos = s.selectionStart; render(); const n = document.querySelector('.toolbar input[type=search]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } });
    return el('div', { class: 'toolbar' }, s,
      exportFn ? el('button', { class: 'btn ghost small', type: 'button', onclick: exportFn, text: 'Export CSV' }) : '',
      el('button', { class: 'btn accent', type: 'button', onclick: onAdd, text: addLabel }));
  }
  const match = (q, ...fields) => !q || fields.join(' ').toLowerCase().includes(q.trim().toLowerCase());
  const empty = t => el('div', { class: 'empty', text: t });

  // ---------- bookings ----------
  function bookingWhat(b) { return b.type === 'Event' ? 'Event: ' + (b.eventTitle || (byId('events', b.eventId) || {}).title || '') : (b.cls || '') + ' · ' + b.type; }
  function renderBookings() {
    const q = ui.q.bookings;
    const chips = el('div', { class: 'chips', role: 'group', 'aria-label': 'Filter by status' }, ['All'].concat(STATUSES).map(s =>
      el('button', { type: 'button', 'aria-pressed': String(ui.bookingStatus === s), onclick: () => { ui.bookingStatus = s; render(); }, text: s })));
    const rows = data.bookings
      .filter(b => ui.bookingStatus === 'All' || b.status === ui.bookingStatus)
      .filter(b => match(q, b.name, b.phone, b.cls, b.type, b.eventTitle, b.note, b.date))
      .sort((a, b) => (a.status === 'Requested') - (b.status === 'Requested') || (b.date || '').localeCompare(a.date || '') || (b.createdAt || '').localeCompare(a.createdAt || ''))
      .sort((a, b) => (b.status === 'Requested') - (a.status === 'Requested'));
    $('view').replaceChildren(
      toolbar('bookings', 'Search bookings', '+ Booking', () => bookingForm(), () => csv(data.bookings, [['Date', b => b.date], ['Time', b => b.time], ['Name', b => b.name], ['Phone', b => b.phone], ['Class', b => b.cls], ['Type', b => b.type], ['Event', b => b.eventTitle], ['People', b => b.people], ['Level', b => b.level], ['Status', b => b.status], ['Paid', b => b.paid ? 'Yes' : 'No'], ['Note', b => b.note], ['Source', b => b.source]], 'bookings')),
      chips, el('div', { style: 'height:12px' }),
      el('div', { class: 'list' }, rows.length ? rows.map(bookingCard) : empty(data.bookings.length ? 'No bookings match.' : 'No bookings yet. Website bookings will appear here automatically.')));
  }
  function bookingCard(b) {
    const status = el('select', { 'aria-label': 'Status for ' + b.name, onchange: async e => { try { await save('bookings', Object.assign({}, b, { status: e.target.value })); toast('Status updated'); render(); } catch (err) { toast(err.message); } } },
      STATUSES.map(s => el('option', { value: s, selected: s === b.status, text: s })));
    const wa = waLink(b.phone, 'Hi ' + (b.name || '').split(' ')[0] + '! ');
    return el('article', { class: 'card' },
      el('div', {},
        el('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px' },
          el('h3', { text: b.name || 'Unknown' }), el('span', { class: 'pill ' + b.status, text: b.status }), el('span', { class: 'pill ' + (b.paid ? 'paid' : 'unpaid'), text: b.paid ? 'Paid' : 'Unpaid' })),
        el('div', { class: 'meta' }, el('span', { text: fmtDate(b.date) + (b.time ? ' · ' + b.time : '') }), el('span', { text: bookingWhat(b) }),
          el('span', { text: (b.people || 1) + (Number(b.people) > 1 ? ' people' : ' person') }), b.level ? el('span', { text: b.level }) : '', b.phone ? el('span', { text: b.phone }) : ''),
        b.note ? el('p', { class: 'note', style: 'margin-top:6px', text: '“' + b.note + '”' }) : ''),
      el('div', { class: 'actions' }, status,
        el('button', { class: 'btn ghost small', type: 'button', onclick: async () => { try { await save('bookings', Object.assign({}, b, { paid: !b.paid })); render(); } catch (err) { toast(err.message); } }, text: b.paid ? 'Mark unpaid' : 'Mark paid' }),
        wa ? el('a', { class: 'btn ghost small', href: wa, target: '_blank', rel: 'noopener', text: 'WhatsApp' }) : '',
        el('button', { class: 'btn ghost small', type: 'button', onclick: () => bookingForm(b), text: 'Edit' })));
  }

  // ---------- clients ----------
  function clientStats(c) {
    const bs = data.bookings.filter(b => b.clientId === c.id);
    return { bookings: bs.length, attended: bs.filter(b => b.status === 'Attended').length, paid: data.payments.filter(p => p.clientId === c.id).reduce((s, p) => s + Number(p.amount || 0), 0), last: bs.map(b => b.date).sort().pop() || '' };
  }
  function renderClients() {
    const q = ui.q.clients;
    const rows = data.clients.filter(c => match(q, c.name, c.phone, c.email, c.instagram, c.level, c.notes)).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    $('view').replaceChildren(
      toolbar('clients', 'Search clients', '+ Client', () => clientForm(), () => csv(data.clients, [['Name', c => c.name], ['Phone', c => c.phone], ['Email', c => c.email], ['Instagram', c => c.instagram], ['Level', c => c.level], ['Bookings', c => clientStats(c).bookings], ['Attended', c => clientStats(c).attended], ['Total paid', c => clientStats(c).paid], ['Notes', c => c.notes], ['Source', c => c.source], ['Added', c => (c.createdAt || '').slice(0, 10)]], 'clients')),
      el('div', { class: 'list' }, rows.length ? rows.map(c => {
        const s = clientStats(c); const wa = waLink(c.phone);
        return el('article', { class: 'card' },
          el('div', {}, el('h3', { text: c.name }),
            el('div', { class: 'meta', style: 'margin-top:4px' }, c.phone ? el('span', { text: c.phone }) : '', c.level ? el('span', { text: c.level }) : '',
              el('span', { text: s.bookings + ' bookings · ' + s.attended + ' attended' }), el('span', { class: 'total', text: money(s.paid) + ' paid' }), s.last ? el('span', { text: 'Last: ' + fmtDate(s.last) }) : ''),
            c.notes ? el('p', { class: 'note', style: 'margin-top:6px', text: c.notes }) : ''),
          el('div', { class: 'actions' },
            wa ? el('a', { class: 'btn ghost small', href: wa, target: '_blank', rel: 'noopener', text: 'WhatsApp' }) : '',
            el('button', { class: 'btn ghost small', type: 'button', onclick: () => clientForm(c), text: 'Open' })));
      }) : empty(data.clients.length ? 'No clients match.' : 'No clients yet. Anyone who books on the website is added automatically.')));
  }

  // ---------- payments ----------
  function renderPayments() {
    const q = ui.q.payments; const month = today().slice(0, 7);
    const rows = data.payments.filter(p => match(q, p.name, p.method, p.note, p.date, p.amount)).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || '').localeCompare(a.createdAt || ''));
    const monthTotal = data.payments.filter(p => (p.date || '').startsWith(month)).reduce((s, p) => s + Number(p.amount || 0), 0);
    const allTotal = data.payments.reduce((s, p) => s + Number(p.amount || 0), 0);
    $('view').replaceChildren(
      toolbar('payments', 'Search payments', '+ Payment', () => paymentForm(), () => csv(data.payments, [['Date', p => p.date], ['Client', p => (byId('clients', p.clientId) || {}).name || p.name], ['Amount', p => p.amount], ['Method', p => p.method], ['Note', p => p.note]], 'payments')),
      el('p', { class: 'meta', style: 'margin:0 0 12px' }, el('span', { class: 'total', text: 'This month: ' + money(monthTotal) }), el('span', { text: 'All time: ' + money(allTotal) })),
      el('div', { class: 'list' }, rows.length ? rows.map(p => {
        const c = byId('clients', p.clientId); const bk = p.bookingId && byId('bookings', p.bookingId);
        return el('article', { class: 'card' },
          el('div', {}, el('h3', { text: money(p.amount) + ' · ' + ((c && c.name) || p.name || '') }),
            el('div', { class: 'meta', style: 'margin-top:4px' }, el('span', { text: fmtDate(p.date) }), el('span', { text: p.method }), bk ? el('span', { text: 'For: ' + bookingWhat(bk) + ' (' + fmtDate(bk.date) + ')' }) : ''),
            p.note ? el('p', { class: 'note', style: 'margin-top:6px', text: p.note }) : ''),
          el('div', { class: 'actions' }, el('button', { class: 'btn ghost small', type: 'button', onclick: () => paymentForm(p), text: 'Edit' })));
      }) : empty('No payments recorded yet.')));
  }

  // ---------- events ----------
  function signups(e) { return data.bookings.filter(b => b.eventId === e.id && b.status !== 'Cancelled'); }
  function renderEvents() {
    const q = ui.q.events; const t = today();
    const rows = data.events.filter(e => match(q, e.title, e.location, e.description, e.date))
      .sort((a, b) => ((a.date < t) - (b.date < t)) || (a.date < t ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date)));
    $('view').replaceChildren(
      toolbar('events', 'Search events', '+ Event', () => eventForm()),
      el('div', { class: 'list' }, rows.length ? rows.map(e => {
        const su = signups(e); const people = su.reduce((s, b) => s + (Number(b.people) || 1), 0);
        return el('article', { class: 'card' },
          el('div', {},
            el('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px' }, el('h3', { text: e.title }),
              el('span', { class: 'pill ' + (e.published ? 'live' : 'draft'), text: e.published ? 'On website' : 'Hidden' }), e.date < t ? el('span', { class: 'pill draft', text: 'Past' }) : ''),
            el('div', { class: 'meta' }, el('span', { text: fmtDate(e.date) + (e.time ? ' · ' + e.time : '') }), e.location ? el('span', { text: e.location }) : '', e.price ? el('span', { text: e.price }) : '',
              el('span', { class: 'total', text: people + (e.capacity ? ' / ' + e.capacity : '') + ' signed up' })),
            su.length ? el('p', { class: 'note', style: 'margin-top:6px', text: su.map(b => b.name + ' (' + b.status + (b.paid ? ', paid' : '') + ')').join(' · ') }) : ''),
          el('div', { class: 'actions' }, el('button', { class: 'btn ghost small', type: 'button', onclick: () => eventForm(e), text: 'Edit' })));
      }) : empty('No events yet. Events you add here and set to "Show on website" appear in the website\'s Events section.')));
  }

  // ---------- forms ----------
  let modalSubmit = null, modalDelete = null;
  function field(label, input, full) { return el('label', { class: 'f' + (full ? ' full' : '') }, label, input); }
  function input(name, value, attrs) { return el('input', Object.assign({ name, value: value == null ? '' : value }, attrs || {})); }
  function select(name, options, value) { return el('select', { name }, options.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o || '—']; return el('option', { value: v, selected: v === value, text: l }); })); }
  function textarea(name, value) { const t = el('textarea', { name }); t.value = value || ''; return t; }
  function check(name, label, checked) { return el('label', { class: 'check full' }, el('input', { type: 'checkbox', name, checked: !!checked }), label); }
  function openModal(title, fields, onSubmit, onDelete) {
    $('modal-title').textContent = title; $('modal-body').replaceChildren(...fields); $('modal-err').textContent = '';
    modalSubmit = onSubmit; modalDelete = onDelete;
    $('modal-del').classList.toggle('hidden', !onDelete);
    $('modal').showModal();
  }
  function formValues() {
    const out = {};
    $('modal-form').querySelectorAll('[name]').forEach(n => { out[n.name] = n.type === 'checkbox' ? n.checked : n.value; });
    return out;
  }
  $('modal-x').addEventListener('click', () => $('modal').close());
  $('modal-form').addEventListener('submit', async e => {
    e.preventDefault(); $('modal-err').textContent = ''; $('modal-save').disabled = true;
    try { await modalSubmit(formValues()); $('modal').close(); render(); toast('Saved'); }
    catch (err) { $('modal-err').textContent = err.message; }
    finally { $('modal-save').disabled = false; }
  });
  $('modal-del').addEventListener('click', async () => {
    if ($('modal-del').dataset.confirm !== '1') { $('modal-del').dataset.confirm = '1'; $('modal-del').textContent = 'Tap again to delete'; return; }
    try { await modalDelete(); $('modal').close(); render(); toast('Deleted'); } catch (err) { $('modal-err').textContent = err.message; }
  });
  $('modal').addEventListener('close', () => { $('modal-del').dataset.confirm = ''; $('modal-del').textContent = 'Delete'; });

  const clientOptions = sel => [['', 'Choose a client…']].concat(data.clients.slice().sort((a, b) => (a.name || '').localeCompare(b.name || '')).map(c => [c.id, c.name + (c.phone ? ' · ' + c.phone : '')]));
  const eventOptions = () => [['', 'Choose an event…']].concat(data.events.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(e => [e.id, e.title + ' · ' + fmtDate(e.date)]));

  function clientForm(c) {
    c = c || {};
    const fields = [
      field('Name', input('name', c.name, { required: true, autocomplete: 'off' })), field('Phone', input('phone', c.phone, { type: 'tel' })),
      field('Email', input('email', c.email, { type: 'email' })), field('Instagram', input('instagram', c.instagram)),
      field('Level', select('level', LEVELS, c.level || '')), el('div'),
      field('Notes', textarea('notes', c.notes), true),
    ];
    if (c.id) {
      const bs = data.bookings.filter(b => b.clientId === c.id).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      const ps = data.payments.filter(p => p.clientId === c.id).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      fields.push(el('div', { class: 'history' },
        el('h4', { text: 'Bookings (' + bs.length + ')' }), bs.length ? el('ul', {}, bs.map(b => el('li', {}, el('span', { text: fmtDate(b.date) + ' · ' + bookingWhat(b) }), el('span', { class: 'pill ' + b.status, text: b.status })))) : el('p', { class: 'note', text: 'None yet.' }),
        el('h4', { text: 'Payments (' + money(ps.reduce((s, p) => s + Number(p.amount || 0), 0)) + ')' }), ps.length ? el('ul', {}, ps.map(p => el('li', {}, el('span', { text: fmtDate(p.date) + ' · ' + p.method }), el('b', { text: money(p.amount) })))) : el('p', { class: 'note', text: 'None yet.' }),
        el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
          el('button', { class: 'btn ghost small', type: 'button', onclick: () => { $('modal').close(); bookingForm({ clientId: c.id }); }, text: '+ Booking' }),
          el('button', { class: 'btn ghost small', type: 'button', onclick: () => { $('modal').close(); paymentForm({ clientId: c.id }); }, text: '+ Payment' }))));
    }
    openModal(c.id ? c.name : 'New client', fields, v => save('clients', Object.assign({ id: c.id }, v)), c.id ? () => del('clients', c.id) : null);
  }

  function bookingForm(b) {
    b = b || {};
    const typeSel = select('type', TYPES, b.type || 'Group class');
    const evField = field('Event', select('eventId', eventOptions(), b.eventId || ''), true);
    const clsField = field('Class', select('cls', CLASSES, b.cls || 'Afro'));
    const dateField = field('Date', input('date', b.date || today(), { type: 'date' }));
    const timeField = field('Time', input('time', b.time, { placeholder: 'e.g. 19:00 or Evening' }));
    const sync = () => { const ev = typeSel.value === 'Event'; evField.classList.toggle('hidden', !ev); [clsField, dateField, timeField].forEach(f => f.classList.toggle('hidden', ev)); };
    typeSel.addEventListener('change', sync);
    const fields = [
      field('Client', select('clientId', clientOptions(), b.clientId || ''), true),
      field('Type', typeSel), clsField, evField, dateField, timeField,
      field('People', input('people', b.people || 1, { type: 'number', min: 1, max: 20 })), field('Level', select('level', LEVELS, b.level || '')),
      field('Status', select('status', STATUSES, b.status || 'Confirmed')), check('paid', 'Paid', b.paid),
      field('Note', textarea('note', b.note), true),
    ];
    if (!data.clients.length) fields.unshift(el('p', { class: 'err full', text: 'Add a client first.' }));
    openModal(b.id ? 'Edit booking' : 'New booking', fields, v => save('bookings', Object.assign({ id: b.id }, v, { people: Number(v.people) || 1 })), b.id ? () => del('bookings', b.id) : null);
    sync();
  }

  function paymentForm(p) {
    p = p || {};
    const clientSel = select('clientId', clientOptions(), p.clientId || '');
    const bookingSel = el('select', { name: 'bookingId' });
    const fillBookings = () => {
      const bs = data.bookings.filter(b => b.clientId === clientSel.value).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      bookingSel.replaceChildren(el('option', { value: '', text: '— Not linked —' }), ...bs.map(b => el('option', { value: b.id, selected: b.id === p.bookingId, text: fmtDate(b.date) + ' · ' + bookingWhat(b) + (b.paid ? ' (paid)' : '') })));
    };
    clientSel.addEventListener('change', fillBookings); fillBookings();
    const fields = [
      field('Client', clientSel, true), field('For booking (optional)', bookingSel, true),
      field('Amount (' + CUR + ')', input('amount', p.amount, { type: 'number', min: 0, step: '0.01', inputmode: 'decimal' })), field('Method', select('method', METHODS, p.method || 'Bit')),
      field('Date', input('date', p.date || today(), { type: 'date' })), el('div'),
      field('Note', textarea('note', p.note), true),
    ];
    openModal(p.id ? 'Edit payment' : 'New payment', fields, async v => {
      await save('payments', Object.assign({ id: p.id }, v, { amount: Number(v.amount) }));
      const bk = v.bookingId && byId('bookings', v.bookingId);
      if (bk && !bk.paid) await save('bookings', Object.assign({}, bk, { paid: true }));
    }, p.id ? () => del('payments', p.id) : null);
  }

  function eventForm(e) {
    e = e || { published: true };
    const fields = [
      field('Title', input('title', e.title, { required: true }), true),
      field('Date', input('date', e.date || today(), { type: 'date' })), field('Time', input('time', e.time, { placeholder: 'e.g. 19:00–21:00' })),
      field('Location', input('location', e.location), true),
      field('Price', input('price', e.price, { placeholder: 'e.g. ₪80' })), field('Capacity (0 = no limit)', input('capacity', e.capacity || 0, { type: 'number', min: 0 })),
      field('Description', textarea('description', e.description), true),
      check('published', 'Show on website', e.published),
    ];
    openModal(e.id ? 'Edit event' : 'New event', fields, v => save('events', Object.assign({ id: e.id }, v, { capacity: Number(v.capacity) || 0 })), e.id ? () => del('events', e.id) : null);
  }

  start();
})();
</script>
</body>
</html>
